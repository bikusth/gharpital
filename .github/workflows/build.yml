# Rebuilds the app's data whenever a CSV changes (your corrections, hospitals, links, or a new scrape).
name: Build data

on:
  push:
    branches: [main]
    paths:
      - "data/*.csv"
      - "data/raw/nmc_doctors.csv"
      - "build/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Rebuild and save
        run: bash build/save_and_push.sh "Rebuild data"
