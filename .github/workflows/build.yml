# Rebuilds the app's data whenever a CSV changes (your corrections, hospitals, links, or a new scrape).
name: Build data

on:
  push:
    branches: [main]
    paths:
      - "data/*.csv"
      - "data/raw/nmc_doctors.csv"
      - "build/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Build
        run: python build/build_data.py
      - name: Commit built data
        run: |
          git config user.name "gharpital-bot"
          git config user.email "gharpital-bot@users.noreply.github.com"
          git add data/build data/export
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Rebuild data [skip ci]"
            git pull --rebase
            git push
          fi
