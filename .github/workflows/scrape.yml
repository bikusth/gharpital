# Refreshes the NMC register on a schedule.
# Works in rounds of about 30 minutes and saves to the repo after each round, so doctors
# appear on the site within half an hour and a problem never costs more than one round.
# Each run can work for up to ~5.5 hours; the next run carries on where it stopped.
# If NMC blocks GitHub's servers, run scraper/nmc_scraper.py on your own computer instead
# and commit data/raw/; the build workflow does the rest.
name: Scrape NMC register

on:
  schedule:
    - cron: "17 20 * * 6"   # Saturdays 20:17 UTC (Sunday early morning in Nepal)
  workflow_dispatch:
    inputs:
      minutes:
        description: "Stop after this many minutes"
        default: "330"

permissions:
  contents: write

concurrency:
  group: nmc-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          pip install -r scraper/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scrape in rounds, saving after each
        run: |
          set +e   # keep going through the rounds even if one round fails
          total="${{ github.event.inputs.minutes || '330' }}"
          end=$(( SECONDS + total * 60 ))
          round=1
          while true; do
            left=$(( (end - SECONDS) / 60 - 3 ))      # keep a few minutes for the last save
            [ "$left" -lt 2 ] && break
            chunk=$(( left < 30 ? left : 30 ))
            echo "::group::Round $round ($chunk min)"
            python scraper/nmc_scraper.py --workers 2 --minutes "$chunk"
            code=$?
            echo "::endgroup::"
            bash build/save_and_push.sh "NMC register: round $round" data/raw || echo "::warning::Save failed in round $round; the next round will try again"
            [ "$code" -eq 10 ] && { echo "All done for this run."; break; }
            round=$(( round + 1 ))
          done
