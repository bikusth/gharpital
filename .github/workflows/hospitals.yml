# Refreshes hospitals, clinics, dentists, eye care, pharmacies, Ayurveda centres and the
# town/village list from OpenStreetMap once a month, then rebuilds the app data.
name: Refresh places (OpenStreetMap)

on:
  schedule:
    - cron: "41 3 1 * *"   # 1st of each month, 03:41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-build
  cancel-in-progress: false

jobs:
  places:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Fetch places and towns from OpenStreetMap
        run: python build/fetch_osm_places.py
      - name: Save
        run: bash build/save_and_push.sh "Refresh places from OpenStreetMap" data/sources
