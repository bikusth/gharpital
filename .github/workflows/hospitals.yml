# Refreshes the hospital list from OpenStreetMap once a month, then rebuilds the app data.
name: Refresh hospitals (OpenStreetMap)

on:
  schedule:
    - cron: "41 3 1 * *"   # 1st of each month, 03:41 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-build
  cancel-in-progress: false

jobs:
  hospitals:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - name: Fetch hospitals from OpenStreetMap
        run: python build/fetch_osm_hospitals.py
      - name: Build
        run: python build/build_data.py
      - name: Commit
        run: |
          git config user.name "gharpital-bot"
          git config user.email "gharpital-bot@users.noreply.github.com"
          git add data/sources data/build data/export
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Refresh hospitals from OpenStreetMap [skip ci]"
            git pull --rebase
            git push
          fi
